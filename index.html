<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sunrise Bakery</title>
</head>
<body style="font-family: system-ui, sans-serif; max-width: 700px; margin: 60px auto; padding: 0 16px;">
  <h1>Sunrise Bakery</h1>
  <p>Fresh sourdough, croissants and custom cakes. Ask our assistant in the corner for hours and prices.</p>

<script>
(function () {
  const API_URL  = "https://lumwr7v563quzqp23rdkrkjpwa0zgsor.lambda-url.us-east-1.on.aws/";
  const TITLE    = "Sunrise Bakery Assistant";
  const GREETING = "Hi! Ask me about opening hours, prices or ordering.";

  const css = `
    .cw-bubble { position: fixed; bottom: 20px; right: 20px; width: 60px; height: 60px;
      border-radius: 50%; border: none; background: #1d4ed8; color: #fff; font-size: 28px;
      cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,.3); z-index: 99999; }
    .cw-panel { position: fixed; bottom: 92px; right: 20px; width: 340px; max-width: calc(100vw - 32px);
      height: 460px; max-height: calc(100vh - 120px); background: #fff; border-radius: 14px;
      box-shadow: 0 8px 30px rgba(0,0,0,.3); display: none; flex-direction: column;
      overflow: hidden; z-index: 99999; font-family: system-ui, sans-serif; }
    .cw-panel.open { display: flex; }
    .cw-head { background: #1d4ed8; color: #fff; padding: 14px 16px; font-weight: 600;
      display: flex; justify-content: space-between; align-items: center; }
    .cw-close { background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; }
    .cw-msgs { flex: 1; overflow-y: auto; padding: 12px; background: #f3f4f6; }
    .cw-msg { max-width: 85%; padding: 8px 12px; margin: 6px 0; border-radius: 14px;
      font-size: 14px; line-height: 1.4; white-space: pre-wrap; word-wrap: break-word; }
    .cw-msg.bot { background: #fff; color: #111; margin-right: auto; }
    .cw-msg.user { background: #1d4ed8; color: #fff; margin-left: auto; }
    .cw-msg.typing { color: #888; font-style: italic; }
    .cw-form { display: flex; gap: 8px; padding: 10px; border-top: 1px solid #e5e7eb; background: #fff; }
    .cw-input { flex: 1; padding: 9px 12px; border: 1px solid #d1d5db; border-radius: 20px;
      font-size: 14px; outline: none; }
    .cw-send { background: #1d4ed8; color: #fff; border: none; border-radius: 20px;
      padding: 0 16px; cursor: pointer; }
    .cw-send:disabled { opacity: .5; cursor: default; }
  `;
  const style = document.createElement("style");
  style.textContent = css;
  document.head.appendChild(style);

  const root = document.createElement("div");
  root.innerHTML = `
    <div class="cw-panel" id="cw-panel">
      <div class="cw-head"><span>${TITLE}</span><button class="cw-close" id="cw-close" aria-label="Close">×</button></div>
      <div class="cw-msgs" id="cw-msgs"></div>
      <div class="cw-form">
        <input class="cw-input" id="cw-input" placeholder="Type a message..." maxlength="500" autocomplete="off">
        <button class="cw-send" id="cw-send">Send</button>
      </div>
    </div>
    <button class="cw-bubble" id="cw-bubble" aria-label="Open chat">💬</button>`;
  document.body.appendChild(root);

  const panel = document.getElementById("cw-panel");
  const msgsBox = document.getElementById("cw-msgs");
  const input = document.getElementById("cw-input");
  const sendBtn = document.getElementById("cw-send");
  const messages = [];
  let busy = false;

  function addMsg(who, text) {
    const div = document.createElement("div");
    div.className = "cw-msg " + who;
    div.textContent = text;          // textContent (not innerHTML) keeps it safe
    msgsBox.appendChild(div);
    msgsBox.scrollTop = msgsBox.scrollHeight;
    return div;
  }

  async function send() {
    const text = input.value.trim();
    if (!text || busy) return;
    input.value = "";
    addMsg("user", text);
    messages.push({ role: "user", content: text });
    busy = true; sendBtn.disabled = true;
    const typing = addMsg("bot", "Typing…");
    typing.classList.add("typing");
    try {
      const res = await fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({ messages: messages.slice(-10) }),
      });
      const data = await res.json();
      typing.textContent = data.reply;
      typing.classList.remove("typing");
      messages.push({ role: "assistant", content: data.reply });
    } catch (e) {
      typing.textContent = "Sorry, something went wrong. Please try again.";
      typing.classList.remove("typing");
      messages.pop();                // drop the failed question from history
    }
    busy = false; sendBtn.disabled = false;
    input.focus();
  }

  document.getElementById("cw-bubble").onclick = () => {
    panel.classList.toggle("open");
    if (panel.classList.contains("open")) input.focus();
  };
  document.getElementById("cw-close").onclick = () => panel.classList.remove("open");
  sendBtn.onclick = send;
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });

  addMsg("bot", GREETING);
})();
</script>
</body>
</html>
